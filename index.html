<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HELLBREACH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,monospace;touch-action:none;user-select:none}
#c{display:block;width:100%;height:100%;position:absolute;inset:0;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none;z-index:5}
#hud{position:absolute;bottom:0;left:0;right:0;height:58px;background:linear-gradient(to top,#0a0a0a,#1a1a1a);
border-top:2px solid #333;display:flex;align-items:center;justify-content:space-around;color:#0f0;
font-size:13px;padding-bottom:env(safe-area-inset-bottom)}
#hud b{font-size:18px;font-weight:bold}
#msg{position:absolute;top:14%;left:0;right:0;text-align:center;color:#ff0;font-size:16px;
text-shadow:0 0 8px #000,0 0 4px #000;opacity:0;transition:opacity .25s}
#title{position:absolute;inset:0;background:rgba(0,0,0,.94);display:flex;flex-direction:column;
align-items:center;justify-content:center;color:#f44;z-index:10;pointer-events:auto;padding:20px}
#title h1{font-size:clamp(28px,9vw,48px);letter-spacing:3px;text-shadow:0 0 16px #f00;margin-bottom:8px}
#title p{color:#aaa;font-size:13px;margin-bottom:20px;text-align:center}
#title button{background:#300;border:3px solid #f44;color:#f66;padding:14px 36px;font-size:17px;
font-family:inherit;border-radius:4px;-webkit-appearance:none;cursor:pointer}
#title .hint{margin-top:18px;color:#777;font-size:11px;text-align:center;line-height:1.7}
#touch{position:absolute;inset:0;z-index:4;display:none;pointer-events:none}
.joy{position:absolute;width:100px;height:100px;border-radius:50%;
background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);pointer-events:auto;touch-action:none}
#jm{bottom:calc(22px + env(safe-area-inset-bottom));left:18px}
#jl{bottom:calc(22px + env(safe-area-inset-bottom));right:18px}
.knob{position:absolute;width:42px;height:42px;border-radius:50%;
background:rgba(255,70,70,.55);top:29px;left:29px;transition:none}
#bf{position:absolute;bottom:calc(130px + env(safe-area-inset-bottom));right:26px;width:68px;height:68px;
border-radius:50%;background:rgba(255,0,0,.45);border:3px solid #f44;color:#fff;font-size:12px;
font-weight:bold;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#bu{position:absolute;bottom:calc(130px + env(safe-area-inset-bottom));left:26px;width:52px;height:52px;
border-radius:50%;background:rgba(0,140,255,.4);border:3px solid #48f;color:#fff;font-size:10px;
display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="msg"></div>
  <div id="hud" style="display:none">
    <div>HP <b id="hp">100</b></div>
    <div id="face">😐</div>
    <div>ARM <b id="ar">0</b></div>
    <div>AMMO <b id="am">40</b></div>
    <div id="keys">—</div>
  </div>
</div>
<div id="touch">
  <div class="joy" id="jm"><div class="knob" id="km"></div></div>
  <div class="joy" id="jl"><div class="knob" id="kl"></div></div>
  <div id="bf">FIRE</div>
  <div id="bu">USE</div>
</div>
<div id="title">
  <h1>HELLBREACH</h1>
  <p>Retro FPS · Smooth controls</p>
  <button id="go">TAP TO PLAY</button>
  <div class="hint">Left stick move · Right stick look<br>FIRE shoot · USE open doors<br>Find 3 keys → exit</div>
</div>
<script>
(function(){
"use strict";
var mapW=32,mapH=31;
var MAP=[
"WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW",
"W..............W..............W",
"W.WWWW.WWWWWW..W..WWWWWW.WWWW.W",
"W.W..........W.W.W..........W.W",
"W.W.WWWWWWWW.W.W.W.WWWWWWWW.W.W",
"W.W.W......W.W.D.W.W......W.W.W",
"W.W.W.E....W.W...W.W....E.W.W.W",
"W.W.W......W.W.W.W.W......W.W.W",
"W.W.WWWWWWWW.W.W.W.WWWWWWWW.W.W",
"W.W..........W.W.W..........W.W",
"W.WWWW.WWWWWW..W..WWWWWW.WWWW.W",
"W......W.......S.......W......W",
"WWWWWW.W.WWWWWWWWWWWWW.W.WWWWWW",
"W......W...............W......W",
"W.WWWWWWWWWWWW.D.WWWWWWWWWWWW.W",
"W.W............1............W.W",
"W.W.WWWW.WWWWWWWWWWWWW.WWWW.W.W",
"W.W.W..E...............E..W.W.W",
"W.W.W.WWWWWWWWWWWWWWWWWWW.W.W.W",
"W.W.W.....................W.W.W",
"W.W.WWWWWWWW.D.WWWWWWWWWWWW.W.W",
"W.W..........2..........H.W.W.W",
"W.WWWWWWWWWWWWWWWWWWWWWWWWW.W.W",
"W.............B.............W.W",
"W.WWWW.WWWWWWWWWWWWWWWW.WWWW.W",
"W.W..E...............E....3.W.W",
"W.W.WWWWWWWWWWWWWWWWWWWWWWW.W.W",
"W.W.............A...........W.W",
"W.WWWWWWWWWWWW.D.WWWWWWWWWWWW.W",
"W..............X..............W",
"WWWWWWWWWWWWWWWWWWWWWWWWWWWWWW"
];
var grid=[],px=16.5,py=11.5,pa=Math.PI;
var vx=0,vy=0,lookVel=0;
var hp=100,armor=0,ammo=40,score=0,kills=0;
var keys={b:0,r:0,y:0};
var doors=[],enemies=[],items=[],barrels=[];
var running=false,dead=false,won=false;
var fireCd=0,msgT=0,bob=0,kick=0;
var tmx=0,tmy=0,tlx=0,tly=0,tfire=false;
var keysDown={};
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
var MAX_SPEED=5.2,ACCEL=28,FRICTION=14,LOOK_SENS_TOUCH=2.4,LOOK_SENS_MOUSE=0.0018,LOOK_SMOOTH=12;
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W,H,FOV=Math.PI/3,DEPTH=18;
function resize(){W=canvas.width=Math.min(window.innerWidth,720);H=canvas.height=Math.min(window.innerHeight,405);canvas.style.width='100%';canvas.style.height='100%'}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,150)});
resize();
for(var y=0;y<mapH;y++){grid[y]=[];for(var x=0;x<mapW;x++){var c=MAP[y][x];grid[y][x]=(c==='W'||c==='D')?1:0;
if(c==='S'){px=x+0.5;py=y+0.5;pa=Math.PI}
if(c==='D')doors.push({x:x,y:y,open:0,target:0,lock:null});
if(c==='E')enemies.push({x:x+0.5,y:y+0.5,hp:40+(Math.random()*30|0),type:Math.random()<0.4?1:0,cd:0});
if(c==='B')barrels.push({x:x+0.5,y:y+0.5,hp:20});
if(c==='1')items.push({x:x+0.5,y:y+0.5,kind:'key',col:'b'});
if(c==='2')items.push({x:x+0.5,y:y+0.5,kind:'key',col:'r'});
if(c==='3')items.push({x:x+0.5,y:y+0.5,kind:'key',col:'y'});
if(c==='H')items.push({x:x+0.5,y:y+0.5,kind:'hp'});
if(c==='A')items.push({x:x+0.5,y:y+0.5,kind:'ar'});
if(c==='X')items.push({x:x+0.5,y:y+0.5,kind:'exit'});
}}
if(doors[0])doors[0].lock='b';if(doors[1])doors[1].lock='r';if(doors[2])doors[2].lock='y';
items.push({x:px+1.5,y:py+1,kind:'ammo'});items.push({x:px-1,y:py+2,kind:'ammo'});
function cell(x,y){var ix=x|0,iy=y|0;if(ix<0||iy<0||ix>=mapW||iy>=mapH)return 1;
for(var i=0;i<doors.length;i++){var d=doors[i];if(d.x===ix&&d.y===iy)return d.open<0.85?1:0}return grid[iy][ix]}
function showMsg(t,d){msgT=d||2;var el=document.getElementById('msg');el.textContent=t;el.style.opacity='1'}
document.getElementById('go').addEventListener('click',start);
document.getElementById('go').addEventListener('touchend',function(e){e.preventDefault();start()},{passive:false});
function start(){document.getElementById('title').style.display='none';document.getElementById('hud').style.display='flex';
if(isTouch)document.getElementById('touch').style.display='block';running=true;dead=false;won=false;showMsg('FIND THE EXIT',2.5);
try{var a=new(window.AudioContext||window.webkitAudioContext)();window._ac=a;if(a.state==='suspended')a.resume()}catch(e){}}
window.addEventListener('keydown',function(e){keysDown[e.code]=1;if(e.code==='Space'||e.code==='ControlLeft'){e.preventDefault();tfire=true}
if(e.code==='KeyE')tryUse();if(e.code==='KeyR'&&dead)location.reload()});
window.addEventListener('keyup',function(e){keysDown[e.code]=0;if(e.code==='Space'||e.code==='ControlLeft')tfire=false});
function stickCurve(v){var dead=0.12,a=Math.abs(v);if(a<dead)return 0;var t=(a-dead)/(1-dead);t=t*t;return (v<0?-1:1)*t}
function bindJoy(el,knob,setX,setY){var on=false,cx,cy,id=null;
el.addEventListener('touchstart',function(e){e.preventDefault();on=true;id=e.changedTouches[0].identifier;var r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;up(e.changedTouches[0].clientX,e.changedTouches[0].clientY)},{passive:false});
el.addEventListener('touchmove',function(e){e.preventDefault();if(!on)return;for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===id){up(e.changedTouches[i].clientX,e.changedTouches[i].clientY);break}},{passive:false});
el.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===id){on=false;id=null;setX(0);setY(0);knob.style.transform='translate(0,0)';break}});
el.addEventListener('touchcancel',function(){on=false;id=null;setX(0);setY(0);knob.style.transform='translate(0,0)'});
function up(x,y){var dx=(x-cx)/48,dy=(y-cy)/48,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}setX(stickCurve(dx));setY(stickCurve(dy));knob.style.transform='translate('+(dx*26)+'px,'+(dy*26)+'px)'}}
bindJoy(document.getElementById('jm'),document.getElementById('km'),function(v){tmx=v},function(v){tmy=v});
bindJoy(document.getElementById('jl'),document.getElementById('kl'),function(v){tlx=v},function(v){tly=v});
document.getElementById('bf').addEventListener('touchstart',function(e){e.preventDefault();tfire=true},{passive:false});
document.getElementById('bf').addEventListener('touchend',function(){tfire=false});
document.getElementById('bf').addEventListener('touchcancel',function(){tfire=false});
document.getElementById('bu').addEventListener('touchstart',function(e){e.preventDefault();tryUse()},{passive:false});
var mouseAccum=0,locked=false;
canvas.addEventListener('click',function(){if(running&&!isTouch&&canvas.requestPointerLock)canvas.requestPointerLock()});
document.addEventListener('pointerlockchange',function(){locked=document.pointerLockElement===canvas});
document.addEventListener('mousemove',function(e){if(!locked)return;mouseAccum+=e.movementX||0});
canvas.addEventListener('mousedown',function(e){if(e.button===0&&running)tfire=true});
window.addEventListener('mouseup',function(){tfire=false});
function tryUse(){for(var i=0;i<doors.length;i++){var d=doors[i],dx=d.x+0.5-px,dy=d.y+0.5-py;
if(Math.hypot(dx,dy)<1.9){if(d.lock&&!keys[d.lock]){showMsg('NEED '+(d.lock==='b'?'BLUE':d.lock==='r'?'RED':'YELLOW')+' KEY',1.5);return}
d.target=d.target>0.5?0:1;return}}}
function tryFire(){if(fireCd>0||dead)return;if(ammo<=0){fireCd=10;return}ammo--;fireCd=7;kick=0.12;
var dist=0,step=0.07,hx=px,hy=py,sx=Math.cos(pa)*step,sy=Math.sin(pa)*step;
while(dist<14){hx+=sx;hy+=sy;dist+=step;if(cell(hx,hy))break;
for(var i=0;i<enemies.length;i++){var e=enemies[i];if(e.hp<=0)continue;
if(Math.hypot(e.x-hx,e.y-hy)<0.38){e.hp-=22;score+=10;if(e.hp<=0){kills++;score+=50}return}}
for(var j=0;j<barrels.length;j++){var b=barrels[j];if(b.hp<=0)continue;
if(Math.hypot(b.x-hx,b.y-hy)<0.42){b.hp-=22;if(b.hp<=0)explode(b);return}}}}
function explode(b){b.hp=0;for(var i=0;i<enemies.length;i++){var e=enemies[i];if(e.hp<=0)continue;var d=Math.hypot(e.x-b.x,e.y-b.y);if(d<3)e.hp-=50*(1-d/3)}
var pd=Math.hypot(px-b.x,py-b.y);if(pd<3)hurt(30*(1-pd/3))}
function hurt(d){if(armor>0){var a=Math.min(armor,d*0.5);armor-=a;d-=a}hp-=d;
if(hp<=0){hp=0;dead=true;running=false;document.getElementById('title').style.display='flex';
document.getElementById('title').querySelector('h1').textContent='YOU DIED';
document.getElementById('title').querySelector('p').textContent='Score '+score+' · Kills '+kills;
document.getElementById('go').textContent='RESTART';document.getElementById('go').onclick=function(){location.reload()}}}
function update(dt){if(!running||dead||won)return;dt=Math.min(dt,0.033);
var lookTarget=0;lookTarget+=mouseAccum*LOOK_SENS_MOUSE;mouseAccum=0;
lookTarget+=tlx*LOOK_SENS_TOUCH*dt;
lookVel+=(lookTarget-lookVel)*Math.min(1,LOOK_SMOOTH*dt);pa+=lookVel;
while(pa>Math.PI*2)pa-=Math.PI*2;while(pa<0)pa+=Math.PI*2;
var ix=0,iy=0;
if(keysDown['KeyW']||keysDown['ArrowUp'])iy-=1;
if(keysDown['KeyS']||keysDown['ArrowDown'])iy+=1;
if(keysDown['KeyA']||keysDown['ArrowLeft'])ix-=1;
if(keysDown['KeyD']||keysDown['ArrowRight'])ix+=1;
ix+=tmx;iy+=tmy;var ilen=Math.hypot(ix,iy);if(ilen>1){ix/=ilen;iy/=ilen}
var sprint=keysDown['ShiftLeft']||keysDown['ShiftRight']?1.35:1;
var wishX=Math.cos(pa)*(-iy)+Math.cos(pa+Math.PI/2)*ix;
var wishY=Math.sin(pa)*(-iy)+Math.sin(pa+Math.PI/2)*ix;
if(ilen>0.05){vx+=wishX*ACCEL*sprint*dt;vy+=wishY*ACCEL*sprint*dt}
else{var spd=Math.hypot(vx,vy);if(spd>0.01){var drop=Math.min(spd,FRICTION*dt);vx*=(spd-drop)/spd;vy*=(spd-drop)/spd}else{vx=0;vy=0}}
var spd=Math.hypot(vx,vy),maxS=MAX_SPEED*sprint;if(spd>maxS){vx*=maxS/spd;vy*=maxS/spd}
var nx=px+vx*dt,ny=py+vy*dt,r=0.22;
if(!cell(nx+r,py)&&!cell(nx-r,py)&&!cell(nx,py+r)&&!cell(nx,py-r))px=nx;else vx*=0.3;
if(!cell(px,ny+r)&&!cell(px,ny-r)&&!cell(px+r,ny)&&!cell(px-r,ny))py=ny;else vy*=0.3;
var moveAmt=Math.min(1,Math.hypot(vx,vy)/MAX_SPEED);bob+=dt*10*moveAmt;kick=Math.max(0,kick-dt*4);
fireCd=Math.max(0,fireCd-1);if(tfire&&fireCd<=0)tryFire();
for(var i=0;i<doors.length;i++){var d=doors[i];d.open+=(d.target-d.open)*Math.min(1,dt*3.2)}
for(var i=0;i<enemies.length;i++){var e=enemies[i];if(e.hp<=0)continue;e.cd-=dt;var d=Math.hypot(e.x-px,e.y-py);
if(d<10){if(d>1.25){var a=Math.atan2(py-e.y,px-e.x);var ex=e.x+Math.cos(a)*2.0*dt,ey=e.y+Math.sin(a)*2.0*dt;
if(!cell(ex,e.y))e.x=ex;if(!cell(e.x,ey))e.y=ey}else if(e.cd<=0){hurt(9+e.type*3);e.cd=1.15}}}
for(var i=items.length-1;i>=0;i--){var it=items[i];if(Math.hypot(it.x-px,it.y-py)<0.65){
if(it.kind==='key'){keys[it.col]=1;showMsg((it.col==='b'?'BLUE':it.col==='r'?'RED':'YELLOW')+' KEY',1.5)}
else if(it.kind==='hp'){hp=Math.min(100,hp+25);showMsg('+25 HP',1)}
else if(it.kind==='ar'){armor=Math.min(100,armor+40);showMsg('+40 ARMOR',1)}
else if(it.kind==='ammo'){ammo+=15;showMsg('+AMMO',1)}
else if(it.kind==='exit'){won=true;running=false;document.getElementById('title').style.display='flex';
document.getElementById('title').querySelector('h1').textContent='YOU WIN!';
document.getElementById('title').querySelector('p').textContent='Score '+score+' · Kills '+kills;
document.getElementById('go').textContent='PLAY AGAIN';document.getElementById('go').onclick=function(){location.reload()};return}
items.splice(i,1);score+=15}}
if(msgT>0){msgT-=dt;if(msgT<=0)document.getElementById('msg').style.opacity='0'}
document.getElementById('hp').textContent=Math.max(0,hp|0);document.getElementById('ar').textContent=armor|0;
document.getElementById('am').textContent=ammo;var ks=[];if(keys.b)ks.push('🔵');if(keys.r)ks.push('🔴');if(keys.y)ks.push('🟡');
document.getElementById('keys').textContent=ks.length?ks.join(''):'—';
document.getElementById('face').textContent=hp>70?'😐':hp>40?'😟':hp>15?'😣':'😵'}
function render(){ctx.fillStyle='#16162a';ctx.fillRect(0,0,W,H/2);ctx.fillStyle='#242418';ctx.fillRect(0,H/2,W,H/2);
var bobOff=Math.sin(bob)*2.2*(Math.min(1,Math.hypot(vx,vy)/MAX_SPEED));var kickOff=kick*18;var zbuf=new Float32Array(W);
for(var col=0;col<W;col++){var rayAng=pa-FOV/2+(col/W)*FOV;var dist=0,hit=0,step=0.02,hx=px,hy=py;
var sx=Math.cos(rayAng)*step,sy=Math.sin(rayAng)*step;
while(dist<DEPTH&&!hit){hx+=sx;hy+=sy;dist+=step;if(cell(hx,hy))hit=1}
dist*=Math.cos(rayAng-pa);if(dist<0.05)dist=0.05;zbuf[col]=dist;
var wallH=Math.min(H*1.4,(H*0.78)/dist);var shade=Math.max(0.12,1-dist/DEPTH);
var wallCol=hit?('rgb('+(95*shade|0)+','+(68*shade|0)+','+(38*shade|0)+')'):'#000';
var ix=hx|0,iy=hy|0;for(var di=0;di<doors.length;di++)if(doors[di].x===ix&&doors[di].y===iy)wallCol='rgb('+(130*shade|0)+','+(55*shade|0)+','+(18*shade|0)+')';
ctx.fillStyle=wallCol;ctx.fillRect(col,(H-wallH)/2+bobOff-kickOff,1,wallH)}
var sprites=[];
for(var i=0;i<enemies.length;i++){var e=enemies[i];if(e.hp<=0)continue;sprites.push({x:e.x,y:e.y,c:e.type?'#3a3':'#c33',s:0.72})}
for(var i=0;i<barrels.length;i++){var b=barrels[i];if(b.hp<=0)continue;sprites.push({x:b.x,y:b.y,c:'#c50',s:0.48})}
for(var i=0;i<items.length;i++){var it=items[i];var col=it.kind==='key'?(it.col==='b'?'#48f':it.col==='r'?'#f44':'#fc0'):it.kind==='hp'?'#0f0':it.kind==='ar'?'#48f':it.kind==='exit'?'#0f0':'#fa0';sprites.push({x:it.x,y:it.y,c:col,s:0.34})}
sprites.sort(function(a,b){return Math.hypot(b.x-px,b.y-py)-Math.hypot(a.x-px,a.y-py)});
for(var i=0;i<sprites.length;i++){var s=sprites[i];var dx=s.x-px,dy=s.y-py;var dist=Math.hypot(dx,dy);if(dist<0.15||dist>DEPTH)continue;
var ang=Math.atan2(dy,dx)-pa;while(ang>Math.PI)ang-=Math.PI*2;while(ang<-Math.PI)ang+=Math.PI*2;if(Math.abs(ang)>FOV*0.72)continue;
var sx=W/2+(ang/FOV)*W;var sh=(H*0.48*s.s)/dist;var sc=Math.max(0.18,1-dist/DEPTH);
var cx=sx|0;if(cx>=0&&cx<W&&zbuf[cx]<dist-0.25)continue;ctx.globalAlpha=sc;ctx.fillStyle=s.c;ctx.fillRect(sx-sh/2,H/2-sh/2+bobOff,sh,sh);ctx.globalAlpha=1}
var wBob=Math.sin(bob*0.5)*3*Math.min(1,Math.hypot(vx,vy)/MAX_SPEED);
ctx.fillStyle='#2a2a2a';ctx.fillRect(W*0.36+wBob,H*0.70+kickOff*0.5,W*0.28,H*0.32);
ctx.fillStyle='#444';ctx.fillRect(W*0.43+wBob,H*0.66+kickOff*0.5,W*0.14,H*0.08);
if(fireCd>4){ctx.fillStyle='#ffcc00';ctx.globalAlpha=0.55;ctx.fillRect(W*0.46+wBob,H*0.60,W*0.08,H*0.09);ctx.globalAlpha=1}
ctx.fillStyle='rgba(0,255,80,0.85)';ctx.fillRect(W/2-1,H/2-7,2,14);ctx.fillRect(W/2-7,H/2-1,14,2)}
var last=performance.now();
function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
